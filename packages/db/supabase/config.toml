# Supabase CLI config for local development (`cd packages/db && npx supabase start`).
project_id = "wiwaha-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
# Staff are invited by the owner; couples are invited by their event manager.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
