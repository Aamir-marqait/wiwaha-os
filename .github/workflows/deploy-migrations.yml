name: Deploy migrations
# Applies new files in packages/db/supabase/migrations to the staging Supabase
# project after they are merged. PR CI (ci.yml) has already run them against a
# throwaway Postgres with the RLS tests. Needs one repository secret:
# SUPABASE_ACCESS_TOKEN (Supabase → Account → Access tokens).
on:
  push:
    branches: [main, claude/phase-1-foundation]
    paths: ["packages/db/supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_PROJECT_REF: ytqojvumknmebcsjqzio # wiwaha-os-staging (decisions D18)
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the secret is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Pending migrations
        run: node packages/db/scripts/deploy-migrations.mjs --dry-run
      - name: Apply
        run: node packages/db/scripts/deploy-migrations.mjs
